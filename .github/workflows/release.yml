name: release

on:
  push:
    # Ignore all branches for release
    branches-ignore:
      - "**"
    tags:
      - "v*"

# Workflow-level minimum. The `build` job elevates to contents: write / packages: write
# for the GitHub Release + image push; reusable workflows called below inherit this
# baseline and declare whatever more they need internally.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        # goreleaser needs full history + tags for the changelog and version.
        fetch-depth: 0
        persist-credentials: false

    # go.mod is the single source of truth. We derive `1.26.x` from its go directive
    # rather than passing go.mod to setup-go directly: go-version-file pins the exact
    # patch, which is how this build sat on go1.26.0 and collected stdlib CVEs. The
    # directive itself cannot float -- `go mod tidy` and dependabot `go get` always
    # rewrite `go 1.26` back to `go 1.26.0` -- so only its major.minor is read here.
    - name: Resolve Go version
      id: go-version
      run: echo "spec=$(awk '/^go /{split($2,a,"."); print a[1]"."a[2]".x"; exit}' go.mod)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.spec }}
        check-latest: true
        cache: false

    - name: Test
      run: make test

    - name: Login to Docker Hub
      id: docker-login
      run: |
        echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
      env:
        DOCKER_USER: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_USERNAME }}
        DOCKER_PASS: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_PAT }}

    # goreleaser picks the tag for a commit by reverse-lexicographic refname order, so a
    # bare vX.Y.Z tag always loses to a vX.Y.Z-rcN tag on the same commit. That would
    # silently rebuild and republish the RC instead of the final release. The workflow
    # already knows which tag it was triggered by, so pass it explicitly rather than
    # letting goreleaser guess.
    #
    # For a final release we also pin the changelog's starting point to the previous final
    # release. Left to itself goreleaser would start from the most recent RC, so the notes
    # would only cover commits landed after the last RC instead of the whole release.
    - name: Determine release tags
      id: release-tags
      run: |
        echo "current=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          # awk (not grep|head): the no-match case (first final of a prefix, no
          # older final tag) must exit 0. A grep with no matches exits 1, which
          # under the runner's `set -eo pipefail` aborts the step before
          # `previous` is written. Reads to EOF (no early exit -> no SIGPIPE),
          # prints only the first (highest, git pre-sorted) final that isn't
          # the tag being released.
          previous=$(git tag -l 'v*' --sort=-v:refname \
            | awk -v cur="${GITHUB_REF_NAME}" '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != cur && !seen { print; seen=1 }')
          echo "Final release ${GITHUB_REF_NAME}; changelog starts from ${previous:-<none>}"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
        else
          echo "Prerelease ${GITHUB_REF_NAME}; leaving changelog range to goreleaser"
        fi

    - name: Release
      run: make release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ steps.release-tags.outputs.current }}
        # Empty is safe: goreleaser falls back to auto-detection.
        GORELEASER_PREVIOUS_TAG: ${{ steps.release-tags.outputs.previous }}

    # Ko was auto-generating SPDX SBOMs and pushing them to the registry as
    # sha256-<digest>.sbom sidecar tags (cosign's attach-sbom format), against
    # BOTH per-arch digests AND the multi-arch index digest. goreleaser does not
    # do that natively, so we reproduce it here after goreleaser has pushed. Uses
    # the docker keychain populated by the login step.
    #
    # NOTE: `cosign attach sbom` is deprecated in cosign v3 in favor of the OCI
    # 1.1 referrers API (`cosign attest --type spdxjson ...`). We keep the legacy
    # form because that's the tag layout Ko published and downstream consumers
    # expect (sha256-<digest>.sbom). Migrate when the whole fleet moves.
    - name: Install syft
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 #v0.24.2

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

    - name: Attach SPDX SBOM sidecars
      # Three attaches per release: one per arch (resolves for arch-specific
      # digest pulls) and one against the multi-arch tag (resolves for the index
      # digest, which is what `cosign download sbom <img>:<tag>` resolves to).
      # Missing the index attach is what made the first cut of this step a
      # regression vs. Ko -- callers using the tag would get nothing back.
      # The FIPS image only exists on final releases (its docker line in
      # .goreleaser.yaml uses skip_push: auto), so its SBOM is only attached
      # on final tags. All FIPS tag variants (latest-fips, vX-fips, vX.Y-fips,
      # {tag}-fips-amd64) share the same digest as {tag}-fips, so one attach
      # against {tag}-fips makes the SBOM discoverable from any of them.
      run: |
        set -euo pipefail
        IMAGE=anchore/kubernetes-admission-controller
        refs=(
          "${IMAGE}:${GITHUB_REF_NAME}-amd64"
          "${IMAGE}:${GITHUB_REF_NAME}-arm64v8"
          "${IMAGE}:${GITHUB_REF_NAME}"
        )
        if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          refs+=("${IMAGE}:${GITHUB_REF_NAME}-fips")
        fi
        for ref in "${refs[@]}"; do
          sbom="sbom-$(echo "${ref}" | tr ':/' '__').spdx.json"
          syft "${ref}" -o spdx-json="${sbom}"
          cosign attach sbom --sbom "${sbom}" --type spdx "${ref}"
        done
      env:
        COSIGN_YES: "true"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      # always() so we still get the goreleaser dist/ and any partial SBOM output
      # when the SBOM attach step fails -- that's precisely when we need them.
      if: always()
      with:
        name: artifacts
        path: |
          dist/**/*
          sbom-*.spdx.json

  # Fire the e2e suite in CircleCI on RC tags only. The reusable workflow passes
  # the RC tag through to the suite, which pulls the just-published image, and
  # on pass invokes the e2e-callback that the Lambda converts into the gated
  # GA dispatch. Non-RC runs (GA tags) skip this step entirely.
  trigger-e2e:
    needs: [build]
    if: ${{ contains(github.ref_name, '-rc') }}
    uses: $/.github/workflows/trigger-circleci-e2e.yaml
    with:
      tag: ${{ github.ref_name }}
      promote: true
    secrets: inherit # zizmor: ignore[secrets-inherit] required to reach the e2e env secrets from the reusable workflow

  # Slack alert on any failure in this workflow (build/publish/e2e-trigger).
  # needs: lists every prior job so failure() can observe them -- a job that
  # was skipped (trigger-e2e on a GA run) is not a failure, so clean GAs stay
  # quiet.
  notify-failure:
    needs: [build, trigger-e2e]
    if: ${{ failure() }}
    uses: $/.github/workflows/notify-slack-failure.yaml
    with:
      subject: ${{ github.ref_name }}
    secrets:
      # left = reusable workflow's generic input; right = the actual repo/org secret
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_ANCHORE_INTEGRATION_RELEASE_ALERTS }}
