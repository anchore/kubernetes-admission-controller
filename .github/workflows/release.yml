name: release

on:
  push:
    # Ignore all branches for release
    branches-ignore:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    # go.mod is the single source of truth. We derive `1.26.x` from its go directive
    # rather than passing go.mod to setup-go directly: go-version-file pins the exact
    # patch, which is how this build sat on go1.26.0 and collected stdlib CVEs. The
    # directive itself cannot float -- `go mod tidy` and dependabot `go get` always
    # rewrite `go 1.26` back to `go 1.26.0` -- so only its major.minor is read here.
    - name: Resolve Go version
      id: go-version
      run: echo "spec=$(awk '/^go /{split($2,a,"."); print a[1]"."a[2]".x"; exit}' go.mod)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.spec }}
        check-latest: true
        cache: false

    - name: Test
      run: make test

    - name: Setup Ko
      uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 #v0.10

    - name: Login to Docker Hub
      id: docker-login
      run: |
        echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
      env:
        DOCKER_USER: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_USERNAME }}
        DOCKER_PASS: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_PAT }}

    - name: Release Container
      run: make release
